<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Helder harness</title>
    <style>
      /* Mirror Home Assistant's root typography (typography.globals.ts) so sizes match the real frontend. */
      html {
        font-size: 14px;
        --ha-font-size-scale: 1;
        --ha-font-size-xs: calc(10px * var(--ha-font-size-scale));
        --ha-font-size-s: calc(12px * var(--ha-font-size-scale));
        --ha-font-size-m: calc(14px * var(--ha-font-size-scale));
        --ha-font-size-l: calc(16px * var(--ha-font-size-scale));
        --ha-font-size-xl: calc(20px * var(--ha-font-size-scale));
        --ha-font-size-2xl: calc(24px * var(--ha-font-size-scale));
        --ha-font-size-3xl: calc(28px * var(--ha-font-size-scale));
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--lovelace-background);
        background-attachment: fixed;
        color: var(--helder-color-text);
        font-family: var(--helder-font-family);
      }
      #app:not(:has(helder-settings-panel)) { padding: 16px; }
      h1 { font-size: 1.2rem; font-weight: 400; margin: 0 0 1rem; }
      h2 { font-size: .9rem; font-weight: 400; color: var(--helder-color-text-muted); margin: 1rem 0 .5rem; }
      .grid { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-start; }
      figure { margin: 0; display: grid; gap: .35rem; }
      figcaption { font-size: .75rem; color: var(--helder-color-text-muted); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="../dev-dist/harness.js"></script>
  </body>
</html>
